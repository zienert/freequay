name: Game report
description: "Tell us what happened when you started a game or program in Freequay."
title: "Game: "
labels: ["game-report"]
body:
  - type: markdown
    attributes:
      value: |
        Describe what happened. The rating in the table "What runs" in the README comes from your answers and your Mac, so you do not have to judge how well it ran. Reports of games that run help as much as reports of games that do not.

        Freequay is free and comes without support, so a report may stay unanswered and a fix is not promised.

        This page is public. Logs can contain your user name and the names of your folders, so remove them before you paste anything.
  - type: input
    id: game
    attributes:
      label: Game or program
      description: "Its name, and for a Steam game its app ID: the number in the address of its store page."
      placeholder: "Alien Swarm, Steam app 630"
    validations:
      required: true
  - type: dropdown
    id: progress
    attributes:
      label: How far did you get?
      options:
        - "It did not start"
        - "A window or launcher opened, then it stopped"
        - "It reached the main menu"
        - "I played it"
  - type: checkboxes
    id: problems
    attributes:
      label: What did not work well?
      description: "Tick everything that applies."
      options:
        - label: "It crashed"
        - label: "Too slow, it stutters"
        - label: "Graphics errors"
        - label: "Sound problems"
        - label: "Controller, keyboard or mouse problems"
        - label: "Window or fullscreen problems"
        - label: "Anti-cheat or a launcher blocked it"
        - label: "Nothing, it ran fine"
  - type: input
    id: fps
    attributes:
      label: Frames per second
      description: "If you know them, for example from the game's own counter or from `freequay run --hud`."
      placeholder: "about 20 in a mission"
  - type: dropdown
    id: changes
    attributes:
      label: Did you change anything to make it run?
      options:
        - "No"
        - "Yes, described below"
  - type: input
    id: mac
    attributes:
      label: Mac
      description: "Model or chip, memory and macOS version, from the Apple menu, About This Mac."
      placeholder: "MacBook Air M1, 16 GB, macOS 27.0.1"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Freequay version
      description: "The number in the file name of the disk image you downloaded."
      placeholder: "0.5.0"
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What happened?
      description: "What you saw. If a setting or a rule made the game run, give it, for example the line you passed to `freequay rule`."
  - type: textarea
    id: log
    attributes:
      label: Message or log
      description: "The message in the Freequay window, for example \"stopped right away (exit code 5)\", or the end of the output of `freequay run --debug`."
      render: text
